# Hermes profile "tonypi" (installed to ~/.hermes/profiles/tonypi/config.yaml by hermes/setup.sh).
# setup.sh fills in the `model:` block for the chosen brain (--brain codex | anthropic | local); the rest is fixed.

model:
  default: lfm3-omni-2b
  provider: custom
  base_url: http://127.0.0.1:8080/v1
  # THE 64K HACK. Hermes refuses windows < 64,000 tokens. tonypi-llm runs -c 16384 -np 2 = 8,192 tokens per slot,
  # so we *claim* 65,536 here and in custom_providers (used when LFM3 is the fallback) and keep every real request
  # small instead: few tools, short SOUL, compression.threshold_tokens below, no bundled skills.
  context_length: 65536

custom_providers:
  - name: lfm3
    base_url: http://127.0.0.1:8080/v1
    api_key: none
    api_mode: chat_completions
    context_length: 65536
    models:
      lfm3-omni-2b:
        context_length: 65536

# Cloud brain unreachable / unauthorised → local LFM3 (setup.sh drops this when LFM3 is already primary).
fallback_providers:
  - provider: custom
    model: lfm3-omni-2b
    base_url: http://127.0.0.1:8080/v1

compression:
  enabled: true
  # absolute trigger, applied to every model including fallbacks: the real local window is 8,192 tokens/slot
  threshold_tokens: 7000
  protect_first_n: 0
  protect_last_n: 8

# The robot is the only toolset: no terminal, files, browser, web, code execution or delegation.
platform_toolsets:
  cli: [mcp-tonypi, memory, skills]
  api_server: [mcp-tonypi, memory, skills]
  telegram: [mcp-tonypi, memory, skills]

mcp_servers:
  tonypi:
    url: http://127.0.0.1:8765/mcp
    timeout: 200          # run_skill(wait=True) can take a while (dance ~60 s)
    connect_timeout: 10
    tools:
      resources: false   # no resource/prompt wrapper tools: every tool schema costs local-model context
      prompts: false

skills:
  # robot skills are copied from hermes/skills by setup.sh (Hermes may refine its copy; the repo stays the source)
  creation_nudge_interval: 15

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 1500
  user_char_limit: 800
  nudge_interval: 10

agent:
  max_turns: 40
  image_input_mode: native  # snapshot/video frames go to the main model as images
  reasoning_effort: low     # default when a request names none; the voice front end picks per task (front.py TIERS)

display:
  # Telegram etc.: a new message while Tony works is delivered into the running turn after the current tool call
  busy_input_mode: steer

telemetry:
  shared_metrics:
    enabled: false
    send: false

tools:
  # off: MCP tools go straight into the tools array. "auto" hides them behind tool_search/tool_describe/tool_call,
  # which a 2B model loops on (seen: 10x tool_describe, no answer).
  tool_search:
    enabled: "off"
  connectors:
    enabled: false

gateway:
  # Tony's gateway is its own process (API server :8642 for the voice front end, Telegram later), not folded into
  # the default profile's multiplexer, so it can run as a systemd unit beside the robot services.
  standalone: true

auxiliary:
  # Side tasks pinned to the ChatGPT login, never "auto": auto walks the main fallback chain and so ends up on LFM3
  # (seen: a 2-call compression summary on LFM3 took 200 s). An explicit provider only falls back on capacity /
  # connection errors, i.e. when the cloud is really unreachable. setup.sh rewrites these for --brain local.
  # No `vision:` entry: an explicit vision backend makes Hermes hand tool images to the model as file paths, not
  # pixels (agent.image_input_mode auto → text); the main model sees snapshots natively.
  compression: {provider: openai-codex, model: gpt-6.1-terra, reasoning_effort: low}
  background_review: {provider: openai-codex, model: gpt-6.1-terra, reasoning_effort: low}
  mcp: {provider: openai-codex, model: gpt-6.1-terra, reasoning_effort: low}
  approval: {provider: openai-codex, model: gpt-6.1-terra, reasoning_effort: low}
  goal_judge: {provider: openai-codex, model: gpt-6.1-terra, reasoning_effort: low}
  title_generation:
    enabled: false   # one more model call per session, for a title nobody reads
