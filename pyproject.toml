[project]
name = "tonypi"
version = "0.1.0"
description = "From-scratch runtime for the Hiwonder TonyPi humanoid on Raspberry Pi 5"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.10"]
agent = ["openai>=1.50", "mcp>=1.10", "claude-agent-sdk>=0.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tonypi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
