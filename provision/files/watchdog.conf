# TonyPi: reboot by itself when userspace hangs (2026-10-29: twice sshd stopped answering and the Pi needed a
# manual power cycle; systemd still fed the hardware watchdog, so it never fired).
# This daemon runs real-time and memory-locked, owns the Pi 5 hardware watchdog (systemd's RuntimeWatchdog is off,
# see tonypi-watchdog.conf), and:
#  - stops feeding it if it can't run at all  -> hardware reset after 15 s
#  - reboots if the health check (sshd banner) fails for 3 minutes in a row
watchdog-device = /dev/watchdog
watchdog-timeout = 15
interval = 5
realtime = yes
priority = 1
test-binary = /usr/local/lib/tonypi/health-check
test-timeout = 30
retry-timeout = 180
log-dir = /var/log/watchdog
